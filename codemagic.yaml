workflows:
  ios-build:
    name: iOS Build Workflow
    max_build_duration: 120
    environment:
      ios_signing:
        provisioning_profile_specifier: YOUR_PROVISIONING_PROFILE
        code_sign_identity: iPhone Distribution
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - pull_request
      branch:
        include_patterns:
          - main
          - develop
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build iOS (.ipa)
        script: |
          flutter build ipa \
            --release \
            --export-method=app-store
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.app
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
